version: '3.9'

services:
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - cs3219-peerprep-network
  user-service:
    build: 
      context: ./backend/user-service
      dockerfile: Dockerfile.user
    container_name: user-service
    ports:
      - "8001:8001"
    env_file:
      - ./backend/user-service/.env
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/peerprepUserDB?authSource=admin
      WEB_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8001
      PORT: 8001
      EMAIL_USER: peerprep.team@gmail.com
    networks:
      - cs3219-peerprep-network

  collaboration-service:
    build:
      context: ./backend/collaboration-service
      dockerfile: Dockerfile.collaboration
    container_name: collaboration-service
    restart: always
    ports:
      - '8004:8004'
      - '8005:8005'
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/peerprep?authSource=admin
      - HTTP_PORT=8004
      - WS_PORT=8005
      - ROOM_TIMEOUT_MINUTES=10
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network

  execution-api:
    build: 
      context: ./backend/execution-service
      dockerfile: Dockerfile.execution
    container_name: execution-api
    ports:
      - "8010:8010"
    env_file:
      - ./backend/execution-service/.env
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network
    command: pnpm run start:api
  execution-worker:
    build: 
      context: ./backend/execution-service
      dockerfile: Dockerfile.execution
    container_name: execution-worker
    env_file:
      - ./backend/execution-service/.env
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network
    command: pnpm run start:worker
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston-api
    restart: always
    ports:
      - '2000:2000'
    privileged: true
    volumes:
      - piston_packages:/piston/packages 
    networks:
      - cs3219-peerprep-network
  question-service:
    build:
      context: ./backend/question-service
      dockerfile: Dockerfile.question
    container_name: question-service
    restart: always
    ports:
      - '8003:8003'
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/peerprepQuestionServiceDB?authSource=admin
      - PORT=8003
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network

networks:
  cs3219-peerprep-network:
    driver: bridge
volumes:
  mongodb_data: {}
  piston_packages: {}
