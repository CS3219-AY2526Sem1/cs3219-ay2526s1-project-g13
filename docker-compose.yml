version: '3.9'

services:
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - cs3219-peerprep-network

  collaboration-service:
    build:
      context: ./backend/collaboration-service
      dockerfile: Dockerfile.collaboration
    container_name: collaboration-service
    restart: always
    ports:
      - '8004:8004'
      - '8005:8005'
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/peerprep?authSource=admin
      - HTTP_PORT=8004
      - WS_PORT=8005
      - ROOM_TIMEOUT_MINUTES=10
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network

  execution-api:
    build: ./backend/execution-service
    ports:
      - "8000:8000"
    volumes:
      - ./backend/execution-service:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network
    command: pnpm run dev:api
  execution-worker:
    build: ./backend/execution-service
    volumes:
      - ./backend/execution-service:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network
    command: pnpm run dev:worker
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston-api
    restart: always
    privileged: true
    volumes:
      - piston_packages:/piston/packages 
    networks:
      - cs3219-peerprep-network
networks:
  cs3219-peerprep-network:
    driver: bridge
volumes:
  mongodb_data: {}
  piston_packages: {}
