version: '3.9'

services:
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - cs3219-peerprep-network
  user-service:
    build: 
      context: ./backend/user-service
      dockerfile: Dockerfile.user
    container_name: user-service
    ports:
      - "8001:8001"
    env_file:
      - ./backend/user-service/.env
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/peerprep?authSource=admin
      WEB_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8001
      PORT: 8001
      EMAIL_USER: peerprep.team@gmail.com
    networks:
      - cs3219-peerprep-network

  collaboration-service:
    build:
      context: ./backend/collaboration-service
      dockerfile: Dockerfile.collaboration
    container_name: collaboration-service
    restart: always
    ports:
      - '8004:8004'
      - '8005:8005'
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/peerprep?authSource=admin
      - HTTP_PORT=8004
      - WS_PORT=8005
      - ROOM_TIMEOUT_MINUTES=10
    depends_on:
      - mongodb
    networks:
      - cs3219-peerprep-network

networks:
  cs3219-peerprep-network:
    driver: bridge

volumes:
  mongodb_data: {}