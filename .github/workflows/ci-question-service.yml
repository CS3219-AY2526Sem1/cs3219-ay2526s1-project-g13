name: CI (backend - question service)

on:
  pull_request:
    branches: [dev, staging]
    paths:
      - "backend/question-service/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/ci-question-service.yml"
  push:
    branches: [dev, staging]
    paths:
      - "backend/question-service/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/ci-question-service.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Smoke tests
    runs-on: ubuntu-latest
    env:
      CI: true
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Enable Corepack & pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/question-service
          file: ./backend/question-service/Dockerfile.question
          push: false
          tags: question-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
